# Act / clarify / stop examples for AbstentionTask.
#
# Each task states the correct response in `expected_outcome`:
#   act     - do the request (checked by the nested `action_task`);
#   clarify - ask a question (send_msg_to_user): the request is ambiguous;
#   stop    - say it can't be done (report_infeasible): the item is absent.
# On clarify/stop tasks any app-state change is scored as a (wrong) act.
#
# Pair with an agent that offers those actions, e.g.
# `agent=GPT-5.5-computer-use-abstention tasks=abstention_examples
#  task_name=abstention_clarify_paper_deadline`.
# `_convert_: all` makes Hydra instantiate the nested action_task.
# All three use the default app seed.

# Exactly one saved place is named "Times Square".
abstention_act_remove_times_square:
  _target_: open_apps.tasks.tasks.AbstentionTask
  _convert_: all
  goal: Remove the Times Square landmark from my saved places.
  expected_outcome: act
  action_task:
    _target_: open_apps.tasks.tasks.RemoveLandmarkTask
    goal: Remove the Times Square landmark from my saved places.
    name: Times Square

# Many calendar events are paper deadlines (WACV, AAAI, SIGKDD, ...).
abstention_clarify_paper_deadline:
  _target_: open_apps.tasks.tasks.AbstentionTask
  goal: Remove the paper deadline from my calendar.
  expected_outcome: clarify

# No such todo exists; "Call Aunt Lisa" is only a near match.
abstention_stop_call_uncle_ian:
  _target_: open_apps.tasks.tasks.AbstentionTask
  goal: Delete the 'Call Uncle Ian' todo.
  expected_outcome: stop
