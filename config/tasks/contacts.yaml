# Tasks anchored on the Contacts app.
#
# Standalone file: run with `tasks=contacts` (Hydra) or load directly.
# Deliberately NOT folded into `all_tasks`, which is the paper's canonical
# task inventory -- the same call as `openbanking.yaml`.
#
# Contacts is where names live: the messenger stores handles only and asks
# Contacts what to draw. So these tasks measure two things -- editing the
# address book itself, and the cross-app hop between a number in a chat and a
# person in the book (the climbing-gym sender at +1 (555) 014-2290 is seeded
# as a thread with no contact).
#
# Scoring notes:
#   * handles are compared normalised, so "(555) 010-0077" and "+15550100077"
#     are the same number, and the label ("mobile", "work") is not compared;
#   * contacts are matched by name with the message-recipient rules: an exact
#     display name first, then a unique first name;
#   * every base task has three rephrasings (`<key>__<style>_1`), with all
#     non-goal fields copied verbatim, like `user_goal_variations.yaml`.

add_contact_dana_reyes:
  _target_: open_apps.tasks.tasks.AddContactTask
  goal: Open the Contacts app and add a new contact named Dana Reyes, with the mobile number
    (555) 010-0077 and the email dana.reyes@example.com.
  first_name: Dana
  last_name: Reyes
  phones:
  - '+15550100077'
  emails:
  - dana.reyes@example.com
add_contact_dana_reyes__casual_1:
  _target_: open_apps.tasks.tasks.AddContactTask
  goal: hey, can you add Dana Reyes to my contacts? number's (555) 010-0077, email dana.reyes@example.com
