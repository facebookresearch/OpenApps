    goal: Mark 'Walk for 20 minutes' as done in my todo list.
    todo_name: Walk for 20 minutes

ambiguity_edit_imports_file:
  _target_: open_apps.tasks.tasks.AmbiguityTask
  _convert_: all
  goal: In the code editor, add the line '# reviewed' to the Python file that is just imports.
  expected: ask
  user_reply: basic_imports.py, the one at the top level.
  premise:
    # basic_imports.py and developing/folder_in_folder/inner_file.py are both
    # a comment plus imports.
    - {app: codeeditor, where: {path: "*.py", content: "~import"}, count: ">=2"}
    - {app: codeeditor, where: {path: "*.py", content: "~print"}, count: ">=1"}
  clarified:
    _target_: open_apps.tasks.tasks.EditFileTask
    goal: Add the line '# reviewed' to basic_imports.py.
    file_path: basic_imports.py
    required_fragment: "# reviewed"

ambiguity_message_birthday_friend:
  _target_: open_apps.tasks.tasks.AmbiguityTask
  _convert_: all
  goal: "Message my friend whose birthday is in my calendar: 'Happy birthday!'"
  expected: ask
  user_reply: "Bob -- send him exactly: Happy birthday!"
  premise:
    # Alice, Bob and Charlie are all contacts with a birthday event.
    - {app: calendar, where: {title: "[ABC]*'s Birthday", invitees: "[ABC]*"}, count: ">=3"}
    - {app: messenger, where: {user: "[ABC]*"}, count: ">=3"}
  clarified:
    _target_: open_apps.tasks.tasks.SendMessageTask
    goal: "Send a message to Bob 'Happy birthday!'"
    to: Bob
    message: Happy birthday!


