# Tasks anchored on the Files app.
#
# Standalone file: run with `tasks=files` (Hydra) or load directly.
# Deliberately NOT folded into `all_tasks`, which is the paper's canonical
# task inventory -- the same call as `openbanking.yaml`.
#
# Scoring notes:
#   * the files slice (`/files_all`) compares exactly: paths are addresses, so
#     "Lease-2026.pdf" is not "Lease 2026.pdf" (see
#     AppStateComparison._files_match);
#   * delete means Recently Deleted -- deleting and then emptying the bin
#     fails a delete task. Deletes are stamped with the pinned date
#     (`apps.files.today`); `deleted_on` below mirrors it;
#   * a downloaded statement is pinned by its path, not its bytes, and only
#     months with posted rows exist -- checking has no July, savings does;
#   * `AnswerTask` is scored on the agent's reply (send_msg_to_user), with
#     every app left unchanged;
#   * every base task has three rephrasings (`<key>__<style>_1`), with all
#     non-goal fields copied verbatim, like `user_goal_variations.yaml`.

delete_packing_list:
  _target_: open_apps.tasks.tasks.DeleteFileTask
  goal: In the Files app, delete 'Packing List.txt' from the Documents folder.
  path: Documents/Packing List.txt
