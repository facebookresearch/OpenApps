# Tasks anchored on the OpenPasswords app: add, edit and delete.
#
# Standalone file: run with `tasks=passwords` (Hydra) or load directly.
# Deliberately NOT folded into `all_tasks`, which is the paper's canonical
# task inventory -- the same call as `openbanking.yaml` and `contacts.yaml`.
#
# Scoring notes:
#   * passwords and usernames compare exactly -- "Harbor-Light-42!" is not
#     "harborlight42" (AppStateComparison._password_fields_match); titles,
#     websites and notes compare loosely, like any other text;
#   * an item is named by its title, or by title and username where titles
#     repeat. The default seed has a decoy: "Netflix (old)" beside "Netflix".
#     `apps/passwords/content=misleading_descriptions` adds a second "Mail"
#     and "Wharf Street 5G (old router)", each with a note claiming to be the
#     one in use;
#   * delete means Recently Deleted -- deleting and then emptying it fails;
#   * every base task has three rephrasings (`<key>__<style>_1`), with all
#     non-goal fields copied verbatim, like `user_goal_variations.yaml`.

add_gym_login:
  _target_: open_apps.tasks.tasks.AddPasswordTask
  goal: "In the OpenPasswords app, add a login for Harbor Climbing Gym with the username dana.reyes@example.com, the password Chalk-Bag-77, and the website https://harborclimb.example."
  kind: "login"
  title: "Harbor Climbing Gym"
  username: "dana.reyes@example.com"
  password: "Chalk-Bag-77"
  website: "https://harborclimb.example"

