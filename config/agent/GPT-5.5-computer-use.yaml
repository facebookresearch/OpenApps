defaults:
  - default
  - _self_

model_name: "gpt-5-5-genai-responses"
model_pretty_name: "gpt-5.5-computer-use"
api_version: null
client_type: "openai"
hostname: null
base_url: "https://api.llama.com/compat/v1/"
api_key: ${oc.env:GPT55_API_KEY}
temperature: 1
max_tokens: 5000
aws_access_key: null
aws_secret_key: null
aws_session_token: null
aws_region: us-west-2

custom_actions:
- go_back
- go_forward
- noop
- mouse_click
- mouse_dblclick
- scroll
- mouse_move
- mouse_down
- mouse_up
- mouse_drag_and_drop
- mouse_upload_file
- keyboard_down
- keyboard_up
- keyboard_press
- keyboard_type
- keyboard_insert_text

use_html: false
use_axtree: false
use_screenshot: true
save_som: false
extract_visible_tag: false
extract_clickable_tag: false
extract_coords: false
filter_visible_elements_only: false
use_focused_element: false
prompt_txt:
  system_prompt: You are a GUI agent. You are given a task and your action history,
    with screenshots. You need to perform the next action to complete the task.
  output_format: '

    <think>

    </think>

    <action>

    </action>
    '

  think_prompt: null
  think_abstract_example: null
  think_concrete_example: null
  action_prompt: |
    ## Action Space

    Use exactly one OpenAI computer-use action:
    click(x=..., y=..., button='left')
    double_click(x=..., y=..., button='left')
    drag(path=[{'x': ..., 'y': ...}, {'x': ..., 'y': ...}])
    keypress(keys=['CTRL', 'L'])
    move(x=..., y=...)
    screenshot()
    scroll(x=..., y=..., scroll_x=..., scroll_y=...)
    type(text='...')
    wait()

    Use English in the thought and briefly explain the next action and target.
  action_abstract_example: '<action>type(text='''')</action>

    '
  action_concrete_example: '<action>click(x=x, y=y)</action>

    '
