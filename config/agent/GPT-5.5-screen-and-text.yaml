# label: GPT-5.5 screen + AXTree
# GPT-5.5 seeing both the screenshot and the accessibility tree, with the full
# action set inherited from `default` (bid and coordinate actions). Same
# endpoint and GPT55_API_KEY requirement as GPT-5.5-computer-use; differs from
# GPT-5.5-text-only only in `use_screenshot`.
defaults:
  - default
  - _self_

model_name: "gpt-5-5-genai-responses"
model_pretty_name: "gpt-5.5-with-text"
api_version: null
client_type: "openai"
hostname: null
base_url: "https://api.llama.com/compat/v1/"
api_key: ${oc.env:GPT55_API_KEY}
temperature: 1
max_tokens: 5000
aws_access_key: null
aws_secret_key: null
aws_session_token: null
aws_region: us-west-2

use_screenshot: True # enable screenshot observation
