# label: Gemini 2.5 Flash
# Gemini 2.5 Flash on the default AXTree + screenshot observations, reached
# through an OpenAI-compatible endpoint at http://<agent.hostname>:<agent.port>/
# (`client_type: gemini`). Both the hostname and `api_key` are empty here, so
# supply them at launch.
defaults:
  - default
  - _self_

model_name: "gemini-2.5-flash"
model_pretty_name: "gemini-2.5-flash"
hostname: null
# primary key
api_key: ""
client_type: "gemini"
port: "80"
