# label: Claude 4 Sonnet (Bedrock)
# Claude 4 Sonnet through AWS Bedrock (`client_type: aws`), on the default
# AXTree + screenshot observations. Bedrock is called with `api_version` as the
# model id (see ModelArgs.make_model), which is null here, so pass
# `agent.api_version=<Bedrock model id>`. The AWS credential fields are null
# too: supply them at launch rather than committing them.
defaults:
  - default
  - _self_

model_name: claude_4_sonnet
api_version: null
model_pretty_name: claude_4_sonnet
client_type: aws
# load from env vars to avoid committing secrets to git
aws_access_key: null
aws_secret_key: null
aws_session_token: null
aws_region: us-west-2
max_tokens: 1000
temperature: 0.5
