# @package _global_
# Submit sweep jobs to SLURM through submitit (`launch_parallel_agents.py
# mode=slurm_cluster`). The paths, account, QOS and partition are placeholders:
# replace them for your cluster before submitting.

# Example values, please replace
project: open_apps

logs_dir:  /example/dir
databases_dir: ${logs_dir}/databases

cluster: slurm

slurm_sweep_launcher:
  gpus_per_node: 0
  nodes: 1
  tasks_per_node: 1
  cpus_per_task: 2
  timeout_min: 400
  slurm_account: example_replace_me
  slurm_qos: qos_example_replace_me
  slurm_partition: partition_example_replace_me
  mem_gb: 10
  slurm_srun_args: ["-vv", "--cpu-bind", "none"]
  slurm_comment: "parallel agent tasks"
