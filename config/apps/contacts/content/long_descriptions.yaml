# @package apps.contacts
#
# The long_descriptions messenger pack adds seventeen more conversations, and
# the messenger now draws every thread's name from Contacts -- so the people
# behind those threads have to be contacts here, or their chats would suddenly
# show bare phone numbers. Handles match the messenger pack's `threads:` keys.
#
# The default people are restated in full rather than appended with
# `+contacts`: plus-keys are merged by the launcher only
# (open_apps.utils.merge_plus_keys), and a composed config without that step --
# tests, the MCP server -- would otherwise replace the defaults with just the
# extras. A list in a content pack replaces the default's list in Hydra.
#
# "Priya" (first name only, a classmate) is a different person from Priya Shah;
# a recipient written as just "Priya" is ambiguous in this pack, on purpose.
defaults:
  - default

contacts:
  - first_name: Alice
    phones: [{label: mobile, value: "+1 (555) 010-0001"}]
    emails: [{label: home, value: alice@example.com}]
  - first_name: Bob
    phones: [{label: mobile, value: "+1 (555) 010-0002"}]
    emails: [{label: home, value: bob@example.com}]
  - first_name: Charlie
    phones: [{label: mobile, value: "+1 (555) 010-0003"}]
    emails: [{label: home, value: charlie@example.com}]
  - first_name: Priya
    last_name: Shah
    phones: [{label: mobile, value: "+1 (555) 010-0004"}]
    emails: [{label: work, value: priya.shah@example.com}]
  - first_name: Marcus
    last_name: Webb
    favorite: true
    phones: [{label: mobile, value: "+1 (555) 010-0005"}]
