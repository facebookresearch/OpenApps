# `_self_` first, so these are the app's baseline and a `content` or `layout`
# pack can override them. Without it Hydra composes this file last and the
# baseline silently wins -- which is how `webshop.yaml`'s `product_images`
# would be discarded. The packs otherwise set a disjoint set of keys.
defaults:
  - _self_
  # The real catalog, so a bare `uv run launch.py` gets a working storefront
  # with no flags. It carries `product_images: hotlink`, which means the
  # default configuration references Amazon's image CDN -- see that pack, and
  # pass `apps.onlineshop.product_images=glyphs` on a node without egress.
  # `content=default` is still the chrome-only pack, now an explicit choice.
  - content: webshop
  - layout: default

# A single SQLite file, like the other apps. The previous implementation wrote
# `cart.json` / `orders.json` into a directory of this name; the rewrite keeps
# everything (catalog included) in one database so other apps can read the
# shop's tables directly.
database_path: ${databases_dir}/onlineshop.db

# Per-app theme override. null = inherit the global `apps/theme` selection.
# Override for just this app with `apps.onlineshop.theme=solarized`.
theme: null

# `enable=False` hides the shop outright.
#
# One subtlety: the shop is hidden rather than broken when it has nothing to
# sell, so a `content` pack with an empty catalog also hides it. That is no
# longer the default path -- it takes an explicit
# `apps/onlineshop/content=default`. See `content/default.yaml`.
enable: True

allowed_credit_cards:
  - 'Visa'
  - 'MasterCard'
enable_credit_card_check: false

# Products per page in listings and search results.
products_per_page: 10

# How product thumbnails are drawn.
#
#   glyphs   generated inline SVG line art, keyed on the product title
#   hotlink  the catalog's own image URLs, as a carousel when there is more
#            than one, falling back to the glyph if an image fails to load
#
# `glyphs` is the default deliberately. Under `hotlink` the pages reference
# the source CDN, which means:
#   * the eval nodes have no outbound network, so the images do not arrive
#     there -- the page still returns 200 and a screenshot-scored agent is
#     graded on an observation that silently lost its imagery;
#   * `tests/test_onlineshop.py::TestNoEgress` will fail, by design;
#   * for the WebShop catalog those URLs point at Amazon's CDN, so hotlinking
#     them is subject to whatever terms attach to that.
# Use it for local browsing and for runs where you have deliberately decided
# the network is available.
product_images: glyphs
