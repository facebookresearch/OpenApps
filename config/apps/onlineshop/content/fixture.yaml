# @package apps.onlineshop

# The catalog the test suite runs against. Not a storefront.
#
# The shop's real catalog comes from the WebShop dump via
# `scripts/fetch_webshop.py`, which is downloaded per-machine and never
# committed. The tests still need a catalog that is fixed, small and present
# in a clean checkout, so this file supplies one.
#
# Everything here is deliberately mechanical: generic product-type names, no
# marketing prose, empty bullets and descriptions. It exists to pin ids,
# prices and option values that assertions reference -- not to read like a
# shop. Two products per category covers the category strip; eighteen total
# puts the listing over `products_per_page` so pagination is exercised.
#
# Assertions depend on specifics here, so read `tests/test_onlineshop.py`
# before editing:
#   * `offi-pen-702` is priced 89.00 (line-total formatting)
#   * `furn-desk-205` offers a walnut finish but never says "walnut" in text
#     (proves option values are indexed for search)
#   * `offi-lamp-704` and `offi-orgz-703` both contain "desk" in their titles
#     and must resolve to their own glyphs, not the desk one
#   * the seeded cart and the two order ids are compared literally

defaults:
  - default

products:
  # ---- electronics ------------------------------------------------------
  # The only two products carrying `images`, so the hotlink mode and its
  # carousel can be tested without a real catalog. The hosts are `.invalid`
  # (RFC 2606) and can never resolve, which is the point: nothing here should
  # ever be fetched, and the default `glyphs` mode must not emit them at all.
  - sku: 'elec-hdph-001'
    title: 'Over-Ear Headphones'
    price: 249.00
    category: electronics
    breadcrumb: ['Electronics', 'Audio']
    rating: 4.6
    options:
      color: ['black', 'silver', 'navy']
    bullets: []
    description: ''
    images:
      - 'https://images.example.invalid/hdph-front.jpg'
      - 'https://images.example.invalid/hdph-side.jpg'
      - 'https://images.example.invalid/hdph-case.jpg'

  # Exactly one image: renders the photo but no carousel controls.
  - sku: 'elec-mntr-002'
    title: '27-inch Monitor'
    price: 379.00
    category: electronics
    breadcrumb: ['Electronics', 'Displays']
    rating: 4.4
    options:
      size: ['27 inch', '32 inch']
    bullets: []
    description: ''
    images:
      - 'https://images.example.invalid/mntr-front.jpg'

