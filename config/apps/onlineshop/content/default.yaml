# @package apps.onlineshop

# Shop chrome only -- no catalog.
#
# This pack is the storefront's settings without any products: the labels,
# the category strip, the currency. It is the base the real catalogs layer
# onto (`webshop.yaml` does `defaults: [default]`, and the translation/
# adversarial packs layer onto `webshop`), and on its own it yields a shop
# with nothing to sell -- which hides the app entirely.
#
# `webshop` is the default pack, so selecting this one is how you ask for a
# shop with no catalog:
#
#     uv run launch.py apps/onlineshop/content=default
#
# With an empty catalog the start page does not register the shop's routes and
# does not show its tile -- the app is absent rather than broken. See
# `start_page.main.initialize_routes_and_configure_task`.
#
# `content/fixture.yaml` holds the small mechanical catalog the test suite
# runs against; it is not intended as a usable storefront.
#
# Product schema (see `onlineshop_app.main.Product`):
#   sku         stable id, used in URLs and in the cart/order state
#   title       display name; also the highest-weighted search field
#   price       float, in `currency` units
#   category    slug, groups products on the home page and in `?category=`
#   breadcrumb  list of crumbs shown on the item page
#   rating      float 0-5, rendered as stars
#   options     mapping of option name -> selectable values (may be empty)
#   bullets     short feature list
#   description free text; searched, and truncated in listings

title: ${apps.start_page.apps.onlineshop.title}

description: 'Your one-stop shop for everything!'
promotional_message: '✨ Special Pick of the Day!'
additional_info_to_item: ''

currency_symbol: '$'

# Shown as the category strip on the home page. Order is preserved. These stay
# here rather than in the generated pack so the labels remain a translation
# axis (see `german.yaml`) independent of whatever catalog is loaded.
categories:
  electronics: 'Electronics'
  home_kitchen: 'Home & Kitchen'
  furniture: 'Furniture'
  apparel: 'Apparel'
  outdoors: 'Outdoors'
  beauty: 'Beauty'
  grocery: 'Grocery'
  office: 'Office'

products: []

cart: []

orders: []
