# @package apps.onlineshop
# The pack's language. It sets the shop's `<html lang>` (zh-Hans) and is read
# by open_apps.i18n for the strings every app shares.
content_language: mandarin
# On top of `webshop`, not `default`: this pack varies the chrome and keeps
# the catalog. `default` is chrome only (`products: []`), and an empty
# catalog hides the shop.
defaults:
  - webshop


description: |
  您值得信赖的开放商城

promotional_message: |
  在这里，每一位顾客都很重要。

# As in `german`: category labels are navigation chrome and translate; the
# catalog (titles, bullets, descriptions, breadcrumbs, option names) stays
# English. The purchase tasks name products by their catalog title
# ("find the 'Vhomes Lights Reclaimed Wood Console Table ...'") and the
# rewards pin the sku and price, so a translated catalog would make those
# tasks unwinnable as written. Override `products` here if a sweep needs a
# fully Chinese catalog -- and give it tasks of its own.
categories:
  electronics: '电子产品'
  home_kitchen: '家居厨房'
  furniture: '家具'
  apparel: '服装'
  outdoors: '户外'
  beauty: '美妆'
  grocery: '食品杂货'
  office: '办公用品'

