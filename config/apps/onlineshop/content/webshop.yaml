# @package apps.onlineshop
#
# The shop's catalog, and its default `content` pack -- a bare
# `uv run launch.py` lands here.
#
# Checked in, so the shop works from a fresh clone with no setup step. It was
# generated by `scripts/fetch_webshop.py`, which stays in the tree as a way to
# rebuild or re-scope this file (a different item dump, a larger `--limit`),
# not as a prerequisite for running the shop. Hand-edits are fine; just know a
# regeneration overwrites them.
#
# Built from YWZBrandon/webshop-data (items_shuffle_1000.json), a mirror of the
# WebShop item dump (Yao et al., 2022). These are scraped Amazon listings, so
# the titles, bullets and descriptions are the retailer's own marketing copy
# and `images` holds amazon.com CDN links.

defaults:
  - default

# Hotlink the catalog's own photos rather than drawing line art. This pack is
# the one case where the URLs exist and point at real images, so a local
# browsing session gets a storefront that looks like a storefront.
#
# It is a per-pack override, not the shop-wide default (`../default.yaml`
# stays on `glyphs`), because hotlinking has two costs that only make sense to
# pay deliberately: eval nodes have no outbound network, so a screenshot-
# scored agent there is graded on a page whose imagery silently failed to
# load; and the pages reference Amazon's CDN, with whatever terms attach.
# Override back per-run with `apps.onlineshop.product_images=glyphs`.
product_images: hotlink

# The 999 products live in `../catalogs/webshop.json`, not here. Every
# Hydra composition parses every YAML file in its defaults list, and with the
# catalog inline that was ~3 s per composition of `config.yaml` -- paid by
# every launch, every sweep child and every test that composes the config,
# whether or not the shop was even served. A `.json` file is invisible to
# Hydra; the shop reads it once, when it seeds its products
# (`open_apps.apps.shop_catalog`). An inline `products:` list still works and
# wins over `catalog` -- `fixture.yaml` is one.
catalog: webshop

cart:
- sku: B06Y3VLDFB
  options: {}
  quantity: 1
- sku: B08R3XSC65
  options: {}
  quantity: 1

# Order history, newest last. A shop account with nothing in its past reads as
# freshly made, so two delivered orders ship by default. Placed by the same
# persona and address the purchase tasks use (config/tasks/openbanking.yaml),
# paid on the business card -- and dated before the earliest row in that
# card's ledger (Jul 31, 2026), so no matching bank charge is expected and the
# ledger's "exactly two Card transactions" invariant is untouched.
orders:
- order_id: 'a41f07c2'
  name: 'Dana Reyes'
  address: '44 Wharf Street Portland ME 04101'
  date: '2026-06-12 14:08:51'
  status: 'Delivered'
  card_last4: '2043'
  items:
  - sku: B097PCJMP5
    options: {}
    quantity: 1
- order_id: '7d93e5b0'
  name: 'Dana Reyes'
  address: '44 Wharf Street Portland ME 04101'
