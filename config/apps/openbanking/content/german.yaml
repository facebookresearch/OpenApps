# @package apps.openbanking
defaults:
  - default

# Chrome and transaction descriptions are translated. Two things deliberately
# are *not*: the account names (they are product names, and tasks address
# accounts by them) and every numeric amount/balance. Tasks score on figures
# read out of this ledger, so the numbers must be identical across every
# content variant or the same task would need a different answer per language.
nav_actions: ["Konto eröffnen"]
# The phone number is a figure, so it stays identical across variants for the
# same reason the amounts do.
open_account_heading: "Neues Konto eröffnen"
open_account_body: "Neue Konten werden telefonisch eröffnet. Rufen Sie uns an, und ein Firmenkundenberater richtet Ihr Konto ein."
close_label: "Schließen"
accounts_heading: "Ihre Konten"
back_to_accounts_label: "Zurück zu den Konten"

available_balance_label: "Verfügbarer Saldo"
present_balance_label: "Aktueller Saldo"
