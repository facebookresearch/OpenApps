available_plus_credit_label: "Verfügbar plus Kredit"
account_number_label: "Kontonummer"
routing_number_label: "Bankleitzahl"
show_number_label: "Vollständige Nummer anzeigen"
hide_number_label: "Nummer ausblenden"

card_number_label: "Kartennummer"
card_expires_label: "Gültig bis"
payment_heading: "Zahlung"
