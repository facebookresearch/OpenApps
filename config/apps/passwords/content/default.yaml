# @package apps.passwords
#
# Seed items. Every secret is obviously synthetic and no real service's
# format is copied; every website is on `.example` (RFC 2606), which never
# resolves, so a clicked link cannot take the agent out of the sandbox.
#
# The items tie into the rest of the world: the tenant portal is the lease's
# landlord (Files > Documents), the patient portal is the insurance card's
# insurer, the VPN is the W-2's employer, and OpenBanking is the bank. Two
# items exist for the tasks: "Netflix (old)" is the one to delete and the
# decoy for changing the Netflix password, and "Iron Harbor Gym" is an ended
# trial next to the gym login a task adds.
#
# `edited_on` is each item's "Last edited" date (ISO). A save stamps
# `apps.passwords.today` instead.
title: ${apps.start_page.apps.passwords.title}
description: ${apps.start_page.apps.passwords.description}

