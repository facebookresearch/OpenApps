# @package apps.start_page
# The start page's headline and each app's tile title (OpenTodos,
# OpenCalendar, ...). Several apps (maps, messenger, OpenBanking) read their
# own titles from here, so a pack that renames their tile renames the app.
headline: "Welcome to OpenApps!"
sub_header: ""

# Apps configuration
apps:
  todo:
    title: "OpenTodos"
    description: # "Manage your tasks and to-dos efficiently"
  calendar:
    title: "OpenCalendar"
    description: # "Keep track of your appointments and events"
  messages:
    title: "OpenMessages"
    description: # "Chat with friends and colleagues"
  maps:
    title: "OpenMaps"
    description: # "Navigate and explore locations"
  codeeditor:
    title: "OpenCodeEditor"
    description: # "Write and edit code seamlessly"
  onlineshop:
    title: "OpenShop"
    description: # "Browse and purchase items online"
  uilibrary:
    title: "OpenUI"
    description:
  openbanking:
    title: "OpenBanking"
    description: # "Review your accounts and transactions"
  files:
    title: "OpenFiles"
    description: # "Browse and manage your documents"
  contacts:
    title: "OpenContacts"
    description: # "Keep your contacts in one place"
