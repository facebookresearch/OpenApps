# @package apps.start_page
# Desktop-shell landing page: a toolbar, a launcher menu and pinnable
# shortcuts, in place of the tile gallery.
#
# Select with `apps/start_page/layout=desktop`. Pair with `apps/theme=meta`
# (or meta_dark) for the Meta-branded palette.
#
# NOTHING HERE IS READ FROM THE CLOCK OR THE NETWORK.
#
# The toolbar time and weather are fixed strings. That is deliberate three
# times over:
#   * a live clock changes every screenshot, so reference comparison in
#     tests/save_screenshots.py would fail on every run;
#   * a weather lookup is egress, and the eval nodes have no outbound network;
#   * a frozen value has a correct answer, so a task can ask "what is the
#     temperature?" and be scored.
# Vary them the way any other appearance axis is varied -- by adding another
# file to this group.
layout: desktop

desktop:
  # Centred at the top of the desktop surface. Falls back to the start page's
  # own `headline` when unset, so the gallery layout's copy is not disturbed.
  headline: "An open source environment for digital agents"
  # Rendered verbatim into the toolbar. Any string; no parsing, no formatting.
  time: "9:41 AM"
  weather:
    # One of: clear, sunny, cloudy, overcast, rain, rainy. Anything else falls
    # back to the cloud glyph rather than rendering a gap.
    condition: "clear"
    temperature: "18°C"
  # Initial light/dark mode. Mutable at runtime via the toolbar toggle, which
  # is scoreable state -- this is only the starting value.
  mode: "light"
  # App keys pinned to the desktop on first load. Also mutable at runtime.
  pinned: ["todo", "calendar"]
  # Programmatically generated background. Rendered by open_apps.wallpaper:
  # ImageMagick if it is on PATH, Pillow otherwise, and if somehow neither
  # works the shell falls back to a pure-CSS gradient of the same hues. Nothing
  # here can take the page down.
  wallpaper:
    enabled: true
    # Each variant is a different arrangement of the same ridges and palette.
    # Deterministic: the same variant renders byte-identically anywhere, which
    # is what keeps screenshot comparison stable across runs.
    variant: 0
    # Force a re-render even when the file is already cached on disk. Leave
    # false in evals -- regenerating on every page load is wasted work and
    # makes the first paint depend on how fast the box is.
    regenerate: false
    # Overlay tuning. blur is the depth-of-field pass (gradient-masked, so it
    # peaks at the top and bottom edges); fade is how far the whole image is
    # pulled toward the page background. 0 = full-strength wallpaper, 1 = it
    # disappears entirely into color-bg.
    blur: "4px"
    fade: 0.7

  # Token names (not hex) used to tint each app's tile, so the launcher does
  # not read as one undifferentiated blue grid. Falls back to color-primary.
  accents:
    todo: color-primary
    calendar: color-accent-violet
    messages: color-accent-teal
    maps: color-success
    codeeditor: color-accent-pink
    onlineshop: color-warning
