# `_self_` first so the layout group can override these. Everything below is
# shared across layouts: the app inventory and icon sets are *what apps exist*,
# not how they are arranged, and both `gallery` and `desktop` need them. They
# lived in the old `layout/default.yaml`, which every other layout composed
# alongside; with `desktop` in the group they need a home both layouts see.
defaults:
  - _self_
  - content: default
  - layout: desktop

# Per-app theme override. null = inherit the global `apps/theme` selection.
# Override for just this app with `apps.start_page.theme=solarized`.
theme: null

# Layout
size: "small"           # Tile size - "small", "medium", or "big"
fade_in: false          # Scroll-reveal fade is cosmetic and leaves the page mid-animation in agent screenshots; keep off for deterministic rendering
random_tile_reoder: false  # Whether to shuffle the items
shuffle_icons: false    # Whether to detach each app's icon from its tile
wrapper_style: 1        # Wrapper style number
wrapper_align: "center" # Wrapper alignment - "left", "center", "right"
wrapper_color: null     # Wrapper color number (1-7) or null
wrapper_invert: false   # Whether to invert the wrapper color scheme

# Tile geometry (radius, padding, gaps) comes from the theme's `radius` and
# `space` tokens, so it follows the theme -- `mono`'s square corners included.
item_hover_effect: true # Highlight the tile under the pointer

# Tile fills. These are the one piece of color the theme does not own: the
# tiles are distinct hues that carry no semantic meaning, so mapping them onto
# theme tokens would flatten seven distinguishable targets into one. Non-light
# themes collapse them to a single fill instead (see `tile_fill_by_tone`).
#
# Dealt by position, and in the default inventory each one is a deeper shade
# of the icon that lands on it (scripts/build_app_icons.py), so the icon reads
# as a raised plate on its own colour: todo ink, calendar carmine, messages
# teal, maps green, code aubergine, shop kraft, bank navy, files terracotta,
# and the UI Library's rose for when its tile is switched on. `broken_logos`
# deals the icons onto the wrong fills, as it should.
app_background_colors:
  ["#22397a", "#93212c", "#0d6b72", "#326a2e", "#432d77", "#7c582d", "#131d33", "#8a3f17", "#983163"]
use_random_colors: false # Generate random colors for items instead of using app_background_colors
tile_fill_by_tone:      # Single fill replacing the palette, by theme tone
  dark: "#636262"
  mono: "#2e2e2e"
# Tile names sit on the fill, so their ink belongs to this palette too. Every
# fill above is deep enough to carry white; the shadow is kept for custom
# palettes with lighter fills.
tile_label_color: "#ffffff"
tile_label_shadow: "rgba(0, 0, 0, 0.35)"

# Icon sets. The theme's `icon_set` asset picks between them: an <img> cannot
# be recolored by a CSS variable, and the greyscale set (same glyphs on one
# graphite tile) beats a `filter: grayscale()` approximation. Both sets are
# generated by scripts/build_app_icons.py; edit the glyphs there, not here.
icon_path: "/assets/icons/real_icons"
bw_icon_path: "/assets/icons/real_icons_bw"

apps:
  todo:
    icon: ${apps.start_page.icon_path}/todo.svg
    bw_icon: ${apps.start_page.bw_icon_path}/todo.svg
    enabled: true
    position: 1
    clickable_logo: false
  calendar:
    icon: ${apps.start_page.icon_path}/calendar.svg
    bw_icon: ${apps.start_page.bw_icon_path}/calendar.svg
    enabled: true
    position: 2
    clickable_logo: false
  messages:
    icon: ${apps.start_page.icon_path}/messages.svg
    bw_icon: ${apps.start_page.bw_icon_path}/messages.svg
    user_icon: ${apps.start_page.bw_icon_path}/user.svg
    group_icon: ${apps.start_page.bw_icon_path}/group.svg
    enabled: true
    position: 3
    clickable_logo: false
  maps:
    icon: ${apps.start_page.icon_path}/maps.svg
    bw_icon: ${apps.start_page.bw_icon_path}/maps.svg
    enabled: true
    position: 4
    clickable_logo: false
  codeeditor:
    icon: ${apps.start_page.icon_path}/code.svg
    bw_icon: ${apps.start_page.bw_icon_path}/code.svg
    enabled: true
    position: 5
    clickable_logo: false
  onlineshop:
    icon: ${apps.start_page.icon_path}/shop.svg
    bw_icon: ${apps.start_page.bw_icon_path}/shop.svg
    enabled: true
    position: 6
    clickable_logo: false
  uilibrary:
    icon: ${apps.start_page.icon_path}/uilibrary.svg
    bw_icon: ${apps.start_page.bw_icon_path}/uilibrary.svg
    enabled: false
    position: 7
    clickable_logo: false
  # Position 8, not 7: OpenBanking and the UI Library were built in parallel
  # and both claimed 7. OpenUI's tile is off by default, so OpenBanking renders
  # seventh either way.
  openbanking:
    icon: ${apps.start_page.icon_path}/wallet.svg
    bw_icon: ${apps.start_page.bw_icon_path}/wallet.svg
    enabled: true
    position: 8
    clickable_logo: false
  files:
    icon: ${apps.start_page.icon_path}/files.svg
    bw_icon: ${apps.start_page.bw_icon_path}/files.svg
    enabled: true
    position: 9
    clickable_logo: false
