# @package apps.code_editor
# The pack's language. Read by open_apps.alignment.events.content_languages
# (adversarial events speak it) and by the editor, which renders its UI in it
# (the *_label keys below) and sets <html lang>.
content_language: german
defaults:
  - default
welcome_message: "Willkommen! Viel Spaß beim Programmieren!"


# --- UI labels ---------------------------------------------------------------
# The editor's own strings (LABELS in codeeditor_app/main.py has the English).
# File and folder names below stay as they are: tasks address files by path.
index_page_label: "Code-Editor-Startseite"
explorer_label: "Explorer"
new_file_label: "Neue Datei"
new_folder_label: "Neuer Ordner"
folder_name_title_label: "Ordnernamen eingeben"
folder_name_placeholder_label: "Ordnername"
create_label: "Erstellen"
error_title_label: "Fehler"
save_first_label: "Bitte speichern Sie zuerst die aktuelle neue Datei"
untitled_folder_error_label: "Ordnernamen dürfen „Untitled-“ nicht enthalten. Dieses Präfix ist für neue Dateien reserviert."
create_folder_failed_label: "Ordner konnte nicht erstellt werden: "
update_mode_failed_label: "Sprache konnte nicht geändert werden: "
update_theme_failed_label: "Design konnte nicht geändert werden: "
language_label: "Sprache: "
theme_label: "Design: "
no_file_selected_label: "Keine Datei ausgewählt"
delete_folder_label: "Ordner löschen"
folder_title_label: "Ordner: {folder}"
delete_folder_failed_label: "Ordner konnte nicht gelöscht werden: "
select_file_prompt_label: "Wählen Sie eine Datei zum Bearbeiten aus oder erstellen Sie eine neue."
save_failed_label: "Datei konnte nicht gespeichert werden: "
delete_file_failed_label: "Datei konnte nicht gelöscht werden: "
rename_failed_label: "Umbenennen fehlgeschlagen: "
close_tab_label: "{name} schließen"
file_name_aria_label: "Dateiname: {file}. Zum Umbenennen doppelklicken."
rename_hint_label: "Zum Umbenennen doppelklicken"
code_editor_aria_label: "Code-Editor – {file}"
code_editor_short_label: "Code-Editor"
editor_description_label: "Code-Editor zum Bearbeiten von {file}"
spaces_label: "Leerzeichen: {n}"
reveal_in_files_label: "In Dateien zeigen"
welcome_fallback_label: "Willkommen! Viel Spaß beim Programmieren!"

+filesystem:
  - type: file
    name: basic_imports.py
    content: |
      # Grundlegende Importe für die Datenmanipulation und -analyse
      import numpy as np
      import pandas as pd
  - type: file
    name: untitled_c.c
    content: |
      // Sehr einfaches C-Programm, das nichts tut
      #include <iostream>
      using namespace std;
      int main() {
        return 0;
      }
  - type: folder
    name: developing
    content:
      - type: file
        name: simple_python.py
        content: |
          # Das erste Python-Programm für viele Anfänger!
          print("Hello, World!")
      - type: folder
        name: folder_in_folder
        content:
          - type: file
            name: inner_file.py
            content: |
              # Die innere Datei im Verzeichnis folder_in_folder
              import json
              import requests
          - type: folder
            name: inner_folder
            content: []
  - type: folder
    name: empty_folder
    content: []
  - type: file
    name: script.py
    content: |
      # Grundlegende PyTorch-Tensoroperation
      import torch
      import random
      
      x = torch.randn(2, 3, 4)
      y = x.transpose(1, 2)
      z = y.view(2, 12)
      print("z shape:", z.shape)