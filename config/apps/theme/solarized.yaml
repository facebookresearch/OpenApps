# @package apps.theme
# Solarized Light (Ethan Schoonover palette).
name: solarized
import_url: ""
tokens:
  color-bg: "#fdf6e3"
  color-surface: "#eee8d5"
  color-fg: "#657b83"
  color-muted: "#93a1a1"
  color-border: "#93a1a1"
  color-primary: "#268bd2"
  color-primary-hover: "#1f6f9f"
  color-on-primary: "#fdf6e3"
  color-accent: "#2aa198"
  color-danger: "#dc322f"
  color-neutral: "#586e75"
  color-btn-fg: "#fdf6e3"
  font-family: "'Inter', system-ui, sans-serif"
  font-heading: "inherit"
  font-mono: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
  font-size-base: "16px"
  font-size-sm: "14px"
  font-size-heading: "1.5rem"
  radius: "8px"
  space: "8px"
  # Syntax colours for the code editor's highlight layer. Solarized accents, each darkened along its own hue to clear AA on base3 (stock sits near 3:1). Comments use base0.
  color-syntax-keyword: "#5f6e00"
  color-syntax-control: "#5f6e00"
  color-syntax-string: "#1a7a73"
  color-syntax-number: "#b8286f"
  color-syntax-comment: "#839496"
  color-syntax-function: "#1f6fa8"
  color-syntax-type: "#8a6800"
  color-syntax-property: "#555aa8"
  color-syntax-constant: "#b23f12"
  color-syntax-tag: "#1f6fa8"
assets:
  tone: light
  icon_set: color
