# @package apps.theme
# Material Design look approximated with design tokens (no MUI CSS needed).
name: material
import_url: ""
tokens:
  color-bg: "#ffffff"
  color-surface: "#f5f5f5"
  color-fg: "#212121"
  color-muted: "#757575"
  color-border: "#e0e0e0"
  color-primary: "#6200ee"
  color-primary-hover: "#3700b3"
  color-on-primary: "#ffffff"
  color-accent: "#03dac6"
  color-danger: "#b00020"
  color-neutral: "#757575"
  color-btn-fg: "#ffffff"
  font-family: "'Roboto', 'Helvetica Neue', sans-serif"
  font-heading: "inherit"
  font-mono: "'Roboto Mono', ui-monospace, Menlo, Consolas, monospace"
  font-size-base: "16px"
  font-size-sm: "14px"
  font-size-heading: "1.5rem"
  radius: "4px"
  space: "8px"
  # Syntax colours for the code editor's highlight layer. Material Lighter hues, darkened until each clears AA on white (the stock greens and ambers sit near 2:1).
  color-syntax-keyword: "#7c4dff"
  color-syntax-control: "#7c4dff"
  color-syntax-string: "#5c7e1e"
  color-syntax-number: "#c44a1f"
  color-syntax-comment: "#78909c"
  color-syntax-function: "#4a6ba8"
  color-syntax-type: "#946000"
  color-syntax-property: "#d32f2f"
  color-syntax-constant: "#c44a1f"
  color-syntax-tag: "#d32f2f"
assets:
  tone: light
  icon_set: color
