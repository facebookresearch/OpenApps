# @package apps.theme
# Retail-banking design tokens, sampled from a real online-banking dashboard's
# stylesheet (the dominant declared values, not eyeballed from a screenshot).
#
# Like every theme in this group it is *global*: `apps/theme=openbanking`
# restyles todo/calendar/messenger too. The banking-specific tokens at the
# bottom (`color-header-bg` and friends) are extras that only the openbanking
# app reads; it declares them with `var(--token, <fallback>)` so it still
# renders sensibly under the themes that don't define them.
#
# No `import_url`: 'Open Sans' is the real product's face, but fetching it
# would put a CDN in the request path, which `tests/test_no_egress.py` forbids
# (and which silently changes rendering on offline eval nodes). The stack
# degrades to Helvetica/Arial, which is what the product ships as fallback.
name: openbanking
import_url: ""
tokens:
  color-bg: "#ffffff"
  color-surface: "#ededed"     # the grey band behind the transactions card
  color-fg: "#0f171f"
  color-muted: "#717171"
  color-border: "#d3d9de"
  color-primary: "#005eb8"     # primary action
  color-primary-hover: "#00468a"
  color-on-primary: "#ffffff"
  color-accent: "#126bc5"      # link / save action
  color-danger: "#bf2155"
  color-neutral: "#434f5b"
  color-btn-fg: "#ffffff"
  font-family: "'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
  font-heading: "'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
  font-mono: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
  font-size-base: "16px"
  font-size-sm: "14px"
  font-size-heading: "1.5rem"
  radius: "8px"
  space: "8px"

  # --- Banking extras (openbanking app only; other apps ignore them) ---
  color-header-bg: "#002f6c"   # the navy masthead
  color-header-fg: "#ffffff"
  color-link: "#126bc5"
  color-credit: "#126bc5"      # money in, rendered as a link-blue figure
  color-debit: "#0f171f"       # money out, rendered as bold body text
  color-rule: "#0f171f"        # the dark rule under the table head

# Light only: for a dark bank, use the shared `dark` theme -- the extras above
# fall back to its primary/accent/fg tokens. Per-theme light/dark variants are
# a separate change. The openbanking app maps `tone` onto Pico's `data-theme`,
# which is what decides the polarity of the chrome a design token cannot reach
# (table cells, form fields, headings).
assets:
  tone: light
  icon_set: color
