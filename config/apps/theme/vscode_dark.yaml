# @package apps.theme
# VS Code "Dark+" — the palette a VLM has seen most often.
#
# Colours are VS Code's own Dark+ values. Chosen for agent evals on two
# grounds: high contrast (low-contrast controls are hard for a VLM to segment
# at all) and familiarity (a model has seen an enormous number of VS Code
# screenshots and essentially none of this app, so a conventional layout lets
# its priors apply rather than fight an unfamiliar UI).
#
# import_url is empty on purpose. Every value here renders from the inline
# :root block, so this theme needs no outbound network — see the code editor's
# local layout fallbacks for the rest of the no-egress story.
name: vscode_dark
import_url: ""
tokens:
  color-bg: "#1e1e1e"          # editor.background
  color-surface: "#252526"     # sideBar.background
  color-fg: "#d4d4d4"          # editor.foreground
  color-muted: "#858585"       # editorLineNumber.foreground
  color-border: "#3c3c3c"      # panel.border
  color-primary: "#0e639c"     # button.background
  color-primary-hover: "#1177bb" # button.hoverBackground
  color-on-primary: "#ffffff"
  color-accent: "#007acc"      # focusBorder / statusBar
  color-danger: "#f14c4c"      # editorError.foreground
  color-neutral: "#3a3d41"     # button.secondaryBackground
  color-btn-fg: "#ffffff"
  font-family: "Consolas, 'Droid Sans Mono', Menlo, 'Courier New', monospace, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'WenQuanYi Micro Hei', 'Droid Sans Fallback'"
  font-heading: "inherit"
  font-size-base: "14px"
  font-size-sm: "13px"         # file tree, editor gutter
  font-size-heading: "1.5rem"
  font-mono: "Consolas, 'Droid Sans Mono', Menlo, 'Courier New', monospace, 'Noto Sans Mono CJK SC', 'Sarasa Mono SC', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'WenQuanYi Micro Hei', 'Droid Sans Fallback'"
  radius: "3px"
  space: "8px"
  # Editor-specific tokens. Other apps ignore them; the code editor uses them
  # for the file tree, which has no analogue in the todo app.
  color-row-hover: "#2a2d2e"   # list.hoverBackground
  color-row-active: "#04395e"  # list.activeSelectionBackground
  color-editor-bg: "#1e1e1e"   # the textarea itself
  color-editor-fg: "#d4d4d4"
  # Syntax colours for the code editor's highlight layer. VS Code Dark+, verbatim.
  color-syntax-keyword: "#569cd6"
  color-syntax-control: "#c586c0"
  color-syntax-string: "#ce9178"
  color-syntax-number: "#b5cea8"
  color-syntax-comment: "#6a9955"
  color-syntax-function: "#dcdcaa"
  color-syntax-type: "#4ec9b0"
  color-syntax-property: "#9cdcfe"
  color-syntax-constant: "#569cd6"
  color-syntax-tag: "#569cd6"

# App-agnostic hints each app maps onto its own concrete asset. Without these
# the theme inherited the light/color defaults, which put a light CodeMirror
# stylesheet (eclipse) on a #1e1e1e pane and colour icons on dark chrome.
  # Desktop-shell tokens: semantic colours, the accents that tint the
  # phone home screen's app icons (apps.start_page.desktop.accents) and the
  # brand rings behind the wallpaper's CSS fallback and the agent cursor.
  # Every theme declares them so the shell never reads an undefined var().
  color-success: "#89d185"
  color-warning: "#cca700"
  color-emphasis: "#d18616"
  color-info: "#04395e"
  color-accent-pink: "#c586c0"
  color-accent-violet: "#b180d7"
  color-accent-teal: "#4ec9b0"
  ring-blue: "#007acc"
  ring-dark-blue: "#0e639c"
  ring-pink: "#c586c0"
  ring-teal: "#4ec9b0"
  ring-violet: "#b180d7"
assets:
  tone: dark
  icon_set: bw
