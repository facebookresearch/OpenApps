# The todo app's baseline config: selects its `content` and
# `layout` packs (both `default`) and holds what neither pack varies --
# the todo database, and the per-app theme override.
defaults:
  - content: default
  - layout: default


database_path: ${databases_dir}/todo.db

# Per-app theme override. null = inherit the global `apps/theme` selection.
# Override for just this app with `apps.todo.theme=solarized`.
theme: null
