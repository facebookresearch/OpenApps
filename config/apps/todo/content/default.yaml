  - ["Check budget", false]
  - ["Tidy living room", true]
  - ["Walk for 20 minutes", false]
  - ["Meditate for 30", false]
  - ["Update calendar", false]
  - ["Answer emails", false]
  - ["Water plants", false]
  - ["Make fruit salad", true]
  - ["Read before bed", false]
