# @package apps.messenger
# The pack's language: drives the UI strings and <html lang>.
content_language: german
defaults:
  - default

# UI strings (keys documented in default.yaml).
type_message_label: "Nachricht schreiben"
search_messages_label: "Nachrichten durchsuchen …"
clear_search_label: "Suche löschen"
search_no_results_label: 'Keine Treffer für „{q}“'
search_one_result_label: '{n} Treffer für „{q}“'
search_results_label: '{n} Treffer für „{q}“'
no_messages_label: "Noch keine Nachrichten"
you_prefix_label: "Du: {message}"
you_label: "Du"
you_sender_label: "du"
chats_label: "Chats"
conversations_label: "Unterhaltungen"
select_conversation_label: "Wähle eine Unterhaltung aus, um zu schreiben"
not_in_contacts_label: "Nicht in deinen Kontakten"
add_to_contacts_label: "Zu Kontakten hinzufügen"
view_contact_label: "Kontakt anzeigen: {name}"
back_label: "Zurück"
send_label: "Senden"
time_format: "{day}. {month}, {hour24}:{minute}"
date_format: "{day}. {month}"
month_abbr: [Jan., Feb., März, Apr., Mai, Juni, Juli, Aug., Sept., Okt., Nov., Dez.]
fixed_replies:
  "+15550100002": "Ja, lass uns am Samstag spielen!"  # Bob
  "+15550100001": "Ja, ich will Badminton spielen!"  # Alice
bot_replies: ["Ich bin ein Bot!", "Ich bin ein Mensch!", "Was gibt's?", "Die Börse spielt heute verrückt!"]

# adding a ton of additional users and conversations
# you: YannLeCun the computer scientist

# threads: handle -> [[message, sender, timestamp], ...]. `sender` is "you"
# or the sender's handle. Names come from the Contacts app, never from here.
threads:
  "+15550100001":  # Alice
    - ["Hallo Yann, hast du in letzter Zeit Fortschritte beim selbstüberwachten Lernen gemacht?", "+15550100001", "Sep 16, 10:00PM"]
    - ["Auf jeden Fall, Alice! Selbstüberwachtes Lernen ist die Zukunft der KI. Ich arbeite an neuen Architekturen.", "you", "Sep 17, 09:32AM"]
    - ["Das ist aufregend! Wird es Maschinen helfen, die Welt besser zu verstehen?", "+15550100001", "Sep 17, 10:01AM"]
    - ["Ja, das Ziel ist es, Maschinen gesunden Menschenverstand zu geben, indem sie aus riesigen Mengen nicht gelabelter Daten lernen.", "you", "Apr 16, 9:00 AM"]
    - ["Faszinierend! Halt mich auf dem Laufenden!", "+15550100001", "Apr 16, 9:03AM"]

  "+15550100002":  # Bob
    - ["Hallo Yann! Was ist deine Lieblings-Neuronales-Netzwerk-Architektur?", "+15550100002", "Jan 05, 8:45PM"]
    - ["Hallo Bob! Ich habe eine Schwäche für Convolutional Neural Networks, aber Transformer sind auch sehr mächtig.", "you", "Jan 05, 8:46PM"]
    - ["Denkst du, dass KI jemals menschliches Intelligenzniveau erreichen wird?", "+15550100002", "Jan 05, 8:49PM"]
    - ["Ich glaube, wir sind noch weit von KI auf menschlichem Niveau entfernt, aber der Fortschritt beschleunigt sich.", "you", "Jan 05, 9:45PM"]
    - ["Danke für deine Einschätzungen, Yann!", "+15550100002", "Jan 05, 9:46PM"]

  "+15550100003":  # Charlie
    - ["Bonjour Yann! Hast du Ratschläge für angehende KI-Forscher?", "+15550100003", "Feb 25, 2:45PM"]
    - ["Bonjour Charlie! Bleib neugierig, lies Forschungsarbeiten und experimentiere mit neuen Ideen. Das Feld ist voller Möglichkeiten.", "you", "Feb 25, 3:45PM"]
    - ["Merci! Was begeistert dich am meisten an der Zukunft der KI?", "+15550100003", "Feb 25, 3:47PM"]
    - ["Das Potenzial der KI, menschliche Intelligenz zu erweitern und reale Probleme zu lösen, begeistert mich am meisten.", "you", "Feb 25, 3:55PM"]
    - ["Inspirierend! Danke, Yann.", "+15550100003", "Feb 25, 4:45PM"]

  "group:fantastic4":  # Fantastic4GroupChat
    - ["Hey Team! Wie geht es allen?", "+15550100001", "Mar 01, 1:00PM"]
    - ["Mir geht's super, Alice! Arbeite gerade an neuen KI-Modellen.", "you", "Mar 01, 1:05PM"]
    - ["Mir auch! Bin begeistert von den neuesten Fortschritten in der KI.", "+15550100002", "Mar 01, 1:10PM"]
    - ["Ich auch! Lasst uns weiter die Grenzen des Möglichen mit KI erweitern.", "+15550100003", "Mar 01, 1:15PM"]
    - ["Auf jeden Fall! Zusammen können wir erstaunliche Dinge erreichen.", "+15550100001", "Mar 01, 1:20PM"]

  "+15550142290":  # not in Contacts
    - ["Hi, hier ist Jordan aus der Kletterhalle. Speicherst du meine Nummer?", "+15550142290", "Apr 18, 6:30PM"]
