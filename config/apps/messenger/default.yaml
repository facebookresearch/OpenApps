# The messenger app's baseline config: selects its `content` and
# `layout` packs (both `default`) and holds what neither pack varies --
# the messenger database, and the per-app theme override.
defaults:
  - content: default
  - layout: default

database_path: ${databases_dir}/messenger.db

# Per-app theme override. null = inherit the global `apps/theme` selection.
# Override for just this app with `apps.messenger.theme=solarized`.
theme: null
