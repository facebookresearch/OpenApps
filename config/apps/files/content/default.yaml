  Documents: "Documents"
  Downloads: "Downloads"
  Receipts: "Receipts"
  Statements: "Statements"
  Code: "Code"
trash_label: "Recently Deleted"
# Shown at the top of Recently Deleted. Display only: nothing is ever purged
# on a clock (see open_apps.files_store).
retention_note: "Items are deleted permanently after 30 days."
days_left_label: "{n} days left"
empty_folder_label: "This folder is empty."
columns: {name: "Name", kind: "Kind", size: "Size", date: "Date modified"}

