# --- Seeded documents ----------------------------------------------------------
# Copied into the store at launch and on every reset. A document is either a
# committed file -- `source`, under src/open_apps/apps/files_app/seed/ (see
# the README there for what each one holds) -- or a text `body` written as is.
# Keyed by a stable id, so a pack can add documents (a new key) without
# restating these, or drop one with `key: null`.
#
# Like the bank's account names and figures, every file below keeps its
# folder, name and contents in every pack: tasks address files by path and
# score them by checksum. Bodies are in English everywhere.
#
# Dates stay before the bank's pinned today (2026-08-26). The August visit
# summary is the latest medical report; no pack may add a later one.
documents:
  visit_aug:
    folder: Documents
    name: "Visit Summary 2026-08-12.pdf"
    modified: "2026-08-12"
    source: visit_aug.pdf
  visit_mar:
    folder: Documents
    name: "Visit Summary 2026-03-09.pdf"
    modified: "2026-03-09"
    source: visit_mar.pdf
  labs_aug:
    folder: Documents
    name: "Lab Results 2026-08-12.pdf"
    modified: "2026-08-13"
    source: labs_aug.pdf
  lease:
    folder: Documents
    name: "Residential Lease - 44 Wharf Street.pdf"
    modified: "2025-09-28"
    source: lease.pdf
  insurance_card:
    folder: Documents
    name: "Insurance Card - Harborline Health.pdf"
    modified: "2026-01-05"
    source: insurance_card.pdf
  w2:
    folder: Documents
    name: "W-2 2025 - Northwind Analytics.pdf"
    modified: "2026-01-30"
    source: w2.pdf
  statement_june:
    folder: Statements
    # The bank's own naming (Statements/<account name> — <Month YYYY>.pdf), so
    # this one sits beside the ones the Statements page downloads. June is
    # older than the bank's seeded ledger, so it is a seeded file rather than
    # one the bank renders; its holder and two savings transfers agree with
    # the bank's seed.
    name: "BUS COMPLETE CHK (...5555) — June 2026.pdf"
    modified: "2026-07-01"
    source: statement_june.pdf
  permit:
    folder: Documents
    name: "Parking Permit 2026.png"
    modified: "2026-01-02"
    source: permit.png
  packing_list:
    folder: Documents
    name: "Packing List.txt"
    modified: "2026-08-24"
    body: |
      Acadia weekend - Sep 18-20

      [ ] tent + footprint
      [ ] sleeping bags (2)
      [ ] headlamps, spare batteries
      [ ] camp stove, 2 fuel canisters
      [ ] rain shells
      [ ] park pass (in glovebox)
      [ ] blood pressure log for the week
      [ ] charger + power bank

  # --- Recently Deleted -------------------------------------------------------
  # Seeded already deleted, with their own `deleted_on`. Against today
  # (2026-08-26) the draft has 2 days left and the scan 25: something for
  # "restore it before it's gone" tasks to find.
  w2_draft:
    folder: Documents
    name: "W-2 2025 (draft).pdf"
    deleted_on: "2026-07-29"
    source: w2_draft.pdf
  labs_scan:
    folder: Documents
    name: "Lab Results 2026-08-12 (scan).pdf"
    deleted_on: "2026-08-21"
    source: labs_scan.pdf
