# @package apps.files
title: ${apps.start_page.apps.files.title}
description: ${apps.start_page.apps.files.description}

# --- The app's own labels ----------------------------------------------------
# Translated by the language packs. Folder *names on disk* are not: they are
# part of every file's path, and paths are what tasks address and score.
