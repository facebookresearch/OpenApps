# --- Seeded documents ----------------------------------------------------------
# Rendered to real files at launch by open_apps.apps.files_app.documents, the
# same bytes every time. Keyed by a stable id, so a pack can add documents
# (a new key) without restating these.
#
# Like the bank's account names and figures, every file below keeps its
# folder, name and contents in every pack: tasks address files by path and
# score them by checksum. Bodies are in English everywhere -- the PDF fonts
# only cover WinAnsi, so CJK text would print as "?" anyway.
#
# Dates stay before the bank's pinned today (2026-08-26). The August visit
# summary is the latest medical report; no pack may add a later one.
