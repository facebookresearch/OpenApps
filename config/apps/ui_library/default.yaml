# The ui library app's baseline config: selects its `content` and
# `layout` packs (both `default`) and holds what neither pack varies --
# the UI library's database, and the per-app theme override.
defaults:
  - content: default
  - layout: default

database_path: ${databases_dir}/uilibrary.db

# Per-app theme override. null = inherit the global `apps/theme` selection.
# Override for just this app with `apps.ui_library.theme=solarized`.
#
# Worth leaving null in most cases: the point of this app is to show what the
# *active* theme does, so pinning it to one theme defeats the purpose.
theme: null
