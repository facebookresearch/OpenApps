# @package apps.ui_library
# Text only -- no structure, no color. Select with
# `apps/ui_library/content=<name>`.
intro: >-
  Every component below is rendered from the shared library, against the
  theme that is currently active. Switch themes with `apps/theme=` to see
  what the tokens actually do.
section_labels:
  tokens: Tokens
  atoms: Atoms
  molecules: Molecules
  brand: Brand

# --- The app's own UI strings ------------------------------------------------
# Flat `*_label` keys, the openbanking pattern: English here, overridden by
# german.yaml / mandarin.yaml, read through open_apps.i18n.label. Component
# names, variant names (the knob buttons) and the `Component(variant=...)`
# snippets are identifiers and the state tasks score, so they are not labels.
# "Return to List of Apps" is shared: open_apps.i18n.SHARED["return_to_apps"].
