name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    # 24.04, not ubuntu-latest: the pinned Playwright (1.44) predates 26.04, and
    # `playwright install --with-deps` there asks for libasound2, which 26.04
    # renamed (libasound2t64), so Chromium never installs.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install uv
          uv sync
          source .venv/bin/activate
      # tests/test_compose_js.py holds the docs composer's JS to the Python
      # reference in headless Chromium; without a browser it would skip.
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium
      - name: Test with pytest
        run: |
          uv run -m pytest tests/
