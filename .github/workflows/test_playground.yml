name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    # Pinned so the apt package names below (24.04's *t64 libraries) hold.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install uv
          uv sync
          source .venv/bin/activate
      # tests/test_compose_js.py holds the docs composer's JS to the Python
      # reference in headless Chromium; without a browser it would skip.
      - name: Install Chromium for Playwright
        # Not `--with-deps`: Playwright 1.44 predates 24.04 and asks apt for
        # pre-t64 names (libasound2) that no longer exist, so the libraries
        # Chromium needs are installed by their current names instead.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libgbm1 libnss3 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libxkbcommon0 libpango-1.0-0 libcairo2
          uv run playwright install chromium
      - name: Test with pytest
        run: |
          uv run -m pytest tests/
