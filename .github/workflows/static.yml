# Simple workflow for deploying static content to GitHub Pages
name: Build and Deploy Docs

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install uv
          uv sync --extra dev
      # Generated from leaderboard/submissions with main's code on every build
      # and gitignored, so the table is always what main's scorer says about
      # the merged bundles. build re-validates every bundle and fails on any
      # failing one, which fails the deploy. The commit time pins
      # generated_at, so redeploying an unchanged main is byte-identical.
      - name: Build leaderboard.json
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            uv run -m open_apps.leaderboard.build --out docs/assets/leaderboard/leaderboard.json
      - name: Build Docs
        run: |
          source .venv/bin/activate 
          mkdocs build
      - name: Publish the leaderboard schemas
        # Where their $id URLs point.
        run: |
          mkdir -p site/schemas
          cp leaderboard/schema/episode.schema.json site/schemas/episode-record-v1.json
          cp leaderboard/schema/meta.schema.json site/schemas/leaderboard-meta-v1.json
          cp leaderboard/schema/demonstration.schema.json site/schemas/leaderboard-demonstration-v1.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
