site_name: OpenApps

theme:
  name: shadcn
  show_title: true # show the title in the top bar
  show_stargazers: false # show the stargazers in the top bar
  pygments_style: # default styles
    light: shadcn-light
    dark: github-dark
  topbar_sections: false # NEW!
  show_datetime: false

site_url: https://facebookresearch.github.io/OpenApps/
repo_url: https://github.com/facebookresearch/OpenApps

# mkdocs renders every page under docs/, nav or not. `internal-*` files are
# git-ignored so CI never checks them out, but exclude them here too — a
# force-added one would otherwise publish straight to GitHub Pages.
exclude_docs: |
  internal-*.md

nav:
  - Start: index.md
  - Manual Installation: installation.md
  - "Intro to UI Agents": Intro to UI Agents.md
  - Agents: agents.md
  - Tasks: tasks.md

markdown_extensions:
  - codehilite
  - admonition
  - pymdownx.blocks.tab
  - pymdownx.blocks.details
