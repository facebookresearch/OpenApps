site_name: OpenApps

theme:
  name: shadcn
  show_title: true # show the title in the top bar
  show_stargazers: false # show the stargazers in the top bar
  pygments_style: # default styles
    light: shadcn-light
    dark: github-dark
  topbar_sections: false # NEW!
  show_datetime: false

site_url: https://facebookresearch.github.io/OpenApps/
repo_url: https://github.com/facebookresearch/OpenApps

# `docs/internal-*.md` are untracked by design (.gitignore line 201), but mkdocs
# builds every page it finds, not just the ones in `nav`. Without this, a plain
# `mkdocs build` renders them into `site/` and -- worse -- inlines their full
# text into `site/search/search_index.json` and their URLs into
# `site/sitemap.xml`, both of which *are* tracked and both of which push to a
# public remote.
exclude_docs: |
  internal-*.md

nav:
  - Start: index.md
  - Manual Installation: installation.md
  - "Intro to UI Agents": Intro to UI Agents.md
  - Agents: agents.md
  - Tasks: tasks.md

markdown_extensions:
  - codehilite
  - admonition
  - pymdownx.blocks.tab
  - pymdownx.blocks.details
