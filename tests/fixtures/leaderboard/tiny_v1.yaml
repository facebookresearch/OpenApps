# A four-cell suite for the leaderboard tests: 2 tasks x 2 cells x 1 seed.
# Same shape as config/benchmark/align_v1.yaml (only `benchmark` is read).
benchmark:
  name: tiny_v1
  seed_set: public
  seeds:
    public: [233]
  blocks:
    core:
      task_names:
        - add_call_mom_to_my_todo
        - delete_call_aunt_lisa
      app_variations:
        - ["apps/theme=default"]
        - ["apps/theme=dark"]
